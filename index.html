<style>
:root{
  --bg:#F4F2EA; --card:#FFFFFF; --ink:#1C2B25; --muted:#5F6B64; --line:#E3E4DA;
  --amber:#2F6B54; --amber-ink:#1F4D3E; --amber-soft:#E1EBE3;
  --sage:#A8C3A0; --sage-soft:#E6F0E3; --sage-ink:#2F5A2A;
  --rose:#E8A0A0; --rose-soft:#FBE7E7; --rose-ink:#8A2B2B;
  --shadow:0 1px 2px rgba(31,42,68,.06),0 6px 20px rgba(31,42,68,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111916; --card:#1B2621; --ink:#EEF2EC; --muted:#A3B1A8; --line:#2B3A33;
    --amber:#8CC2A4; --amber-ink:#C4E3D0; --amber-soft:#23352D;
    --sage-soft:#24352B; --sage-ink:#BFE0B7; --rose-soft:#3F2730; --rose-ink:#F5C2C2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#111916; --card:#1B2621; --ink:#EEF2EC; --muted:#A3B1A8; --line:#2B3A33;
  --amber:#8CC2A4; --amber-ink:#C4E3D0; --amber-soft:#23352D;
  --sage-soft:#24352B; --sage-ink:#BFE0B7; --rose-soft:#3F2730; --rose-ink:#F5C2C2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Georgia,"Fraunces","Times New Roman",serif;font-weight:600;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:640px;margin:0 auto}
header.top .logo{width:34px;height:34px;flex:none}
header.top h1{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.mode{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;width:44px;height:44px;padding:0;
  display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
button.mode svg{width:20px;height:20px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{background:transparent;color:var(--muted);font-weight:600;min-height:40px;padding:8px 6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.swatches button{background:var(--bg);color:var(--ink);border:2px solid transparent;font-weight:600;font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;min-height:0}
.swatches button.on{border-color:var(--amber)}
.swatches .dots{display:flex}
.swatches .dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--card);margin-left:-5px}
.swatches .dots i:first-child{margin-left:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:12px 0}
.hero{text-align:center;padding:26px 18px;background:linear-gradient(160deg,var(--amber-soft),var(--card) 70%)}
.hero .label{color:var(--muted);font-size:14px;letter-spacing:.02em}
.hero .big{font-family:Georgia,"Fraunces",serif;font-size:52px;line-height:1.1;margin:6px 0;font-weight:600}
.hero .big.neg{color:var(--rose-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip b{color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
h2{font-size:22px;margin:18px 2px 4px}
h3{font-size:17px;margin-bottom:8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);
  border-radius:12px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:none;border-color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;min-height:44px;
  background:var(--amber);color:var(--on-accent,#2A1A02);font-weight:700}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
button.soft{background:var(--amber-soft);color:var(--amber-ink)}
button.link{background:none;color:var(--amber-ink);padding:4px 0;min-height:0;font-weight:600;text-decoration:underline}
button.x{background:none;color:var(--muted);padding:6px 10px;min-height:36px;font-size:18px;font-weight:400}
button.wide{width:100%;margin-top:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{flex:1;min-width:60px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);flex:none;
  display:grid;place-items:center;padding:0;min-height:0}
.check.on{background:var(--sage);border-color:var(--sage)}
.check.on::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
.bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px}
.note{background:var(--amber-soft);color:var(--amber-ink);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.note.good{background:var(--sage-soft);color:var(--sage-ink)}
.note.warn{background:var(--rose-soft);color:var(--rose-ink)}
.demo{background:var(--ink);color:var(--bg);text-align:center;font-size:14px;padding:9px 12px}
.demo a{color:var(--amber);font-weight:700}
.next{display:flex;gap:12px;align-items:center}
.next .dot{width:12px;height:12px;border-radius:50%;background:var(--amber);flex:none;box-shadow:0 0 0 6px var(--amber-soft)}
.explain{font-size:14px;margin-top:12px;text-align:left}
.explain .row{padding:6px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;background:none;color:var(--muted);font-weight:600;font-size:12px;padding:6px 2px;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink);background:var(--amber-soft)}
.modal{position:fixed;inset:0;background:rgba(20,27,45,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{width:100%;max-width:420px}
.welcome{text-align:center;padding-top:30px}
.welcome .logo{width:84px;height:84px}
.welcome h1{font-size:30px;margin:12px 0 6px}
.cat{display:inline-block;font-size:12px;background:var(--bg);border-radius:99px;padding:2px 8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.hidden{display:none}
/* charts: marks use the theme accent; text always uses text colours */
:root{--viz-1:var(--amber);--viz-ink:var(--amber-ink);--viz-dim:#CFCBC3}
@supports (color: color-mix(in srgb, red, blue)){:root{--viz-dim:color-mix(in srgb,var(--muted) 38%,var(--card))}}
.chead{display:flex;align-items:flex-start;gap:8px}
.chead h3{margin-bottom:2px}
.chead .grow{flex:1;min-width:0}
button.tbtn{background:none;color:var(--amber-ink);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;min-height:32px;font-size:13px;font-weight:600;flex:none}
.chart{margin-top:10px}
svg.viz{display:block;touch-action:pan-y;overflow:visible;outline:none;-webkit-tap-highlight-color:transparent}
svg.viz:focus-visible{outline:2px solid var(--amber);outline-offset:4px;border-radius:8px}
svg.viz .grid{stroke:var(--line);stroke-width:1}
svg.viz .base{stroke:var(--muted);stroke-opacity:.5;stroke-width:1}
svg.viz .tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
svg.viz .mark{transition:opacity .15s}
svg.viz .mark.dim{opacity:.4}
svg.viz .line{fill:none;stroke:var(--viz-ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.viz .area{fill:var(--viz-ink);fill-opacity:.1;stroke:none}
svg.viz .pt{fill:var(--viz-ink);stroke:var(--card);stroke-width:2}
svg.viz .ref,svg.viz .cross{stroke:var(--ink);stroke-opacity:.45;stroke-width:1}
svg.viz .lbl{fill:var(--ink);font-size:11.5px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.refkey{width:16px;height:0;border-radius:0;border-top:1.5px solid var(--ink);opacity:.5;vertical-align:4px}
#viztip{position:fixed;z-index:30;display:none;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px 11px;font-size:13px;max-width:260px}
#viztip .tt{color:var(--muted);font-size:12px;margin-bottom:3px}
#viztip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
#viztip .tr i{width:10px;height:3px;border-radius:2px;flex:none}
#viztip .tr b{font-variant-numeric:tabular-nums}
#viztip .tr span{color:var(--muted)}
.ctable{margin-top:10px;max-height:280px;overflow:auto}
.ctable table{width:100%;border-collapse:collapse;font-size:14px}
.ctable th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
.ctable th,.ctable td{padding:7px 4px;border-bottom:1px solid var(--line)}
.ctable td:last-child,.ctable th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.brand{display:none}
.today-date{display:none}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:240px}
  .demo{margin-left:-240px}
  nav.tabs{top:0;bottom:0;right:auto;width:240px;border-top:0;border-right:1px solid var(--line);
    flex-direction:column;justify-content:flex-start;padding:22px 14px}
  nav.tabs .in{flex-direction:column;gap:4px}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 14px;min-height:46px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:Georgia,"Fraunces",serif;font-size:19px;font-weight:600;color:var(--ink)}
  .brand .logo{width:36px;height:36px}
  header.top{max-width:1160px;padding:28px 32px 0}
  header.top .logo{display:none}
  header.top h1{font-size:28px}
  .today-date{display:block;margin:0 2px 4px}
  .wrap{max-width:1160px;padding:8px 32px 40px}
  .dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .hero{padding:36px 24px}
  .hero .big{font-size:72px}
  .card{padding:22px}
  .toast{bottom:28px;left:calc(50% + 120px)}
}
@media (min-width:900px) and (max-height:500px){nav.tabs{overflow:auto}}
@media (max-width:380px){.hero .big{font-size:44px}}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
</style>

/* ---------- money logic ---------- */
function billDates(b, from, to){ // occurrence dates in [from, to)
  const out = []; let d = pd(from); d = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = pd(to);
  while (d < end){
    const occ = new Date(d.getFullYear(), d.getMonth(), Math.min(b.day, dim(d.getFullYear(), d.getMonth())));
    const o = ds(occ);
    if (o >= from && o < to && o >= b.from) out.push(o);
    d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  }
  return out;
}
function occurrences(from, to){
  const list = [];
  S.bills.forEach(b => billDates(b, from, to).forEach(date => list.push({ bill: b, date, paid: !!b.paid[date] })));
  return list.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
function calc(){
  const t = today();
  const payday = S.pay.next > t ? S.pay.next : addDays(t, 1);
  const days = Math.max(1, daysBetween(t, payday));
  const due = occurrences(addDays(t, -31), payday).filter(o => !o.paid);
  const overdue = due.filter(o => o.date < t);
  const billsLeft = due.reduce((a, o) => a + o.bill.amount, 0);
  const spentToday = S.spends.filter(s => s.date === t).reduce((a, s) => a + s.amount, 0);
  const pool = S.balance + spentToday - billsLeft - S.buffer;
  const daily = pool / days;
  const left = daily - spentToday;
  return { t, payday, days, due, overdue, billsLeft, spentToday, pool, daily, left };
}
function nextPayDate(s){
  const f = S.pay.freq;
  if (f === "weekly") return addDays(s, 7);
  if (f === "biweekly") return addDays(s, 14);
  if (f === "semimonthly"){ const d = pd(s); if (d.getDate() < 15) return ds(new Date(d.getFullYear(), d.getMonth(), 15)); return ds(new Date(d.getFullYear(), d.getMonth() + 1, 1)); }
  return addMonths(s, 1);
}
function debtPlan(){
  const debts = S.debts.filter(d => d.balance > 0).map(d => ({ ...d, bal: d.balance, paidOff: null, interest: 0 }));
  if (!debts.length) return null;
  const order = debts.slice().sort((a, b) => S.method === "avalanche" ? b.rate - a.rate || a.bal - b.bal : a.bal - b.bal || b.rate - a.rate);
  const budget = debts.reduce((a, d) => a + d.min, 0) + (S.extra || 0);
  let month = 0, totalInterest = 0;
  const totalLeft = () => debts.reduce((a, d) => a + Math.max(0, d.bal), 0);
  const timeline = [totalLeft()];
  while (debts.some(d => d.bal > 0.005) && month < 600){
    month++;
    debts.forEach(d => { if (d.bal > 0){ const i = d.bal * d.rate / 1200; d.bal += i; d.interest += i; totalInterest += i; } });
    let pot = budget;
    debts.forEach(d => { if (d.bal > 0){ const p = Math.min(d.min, d.bal); d.bal -= p; pot -= p; } });
    for (const d of order){ const live = debts.find(x => x.id === d.id); if (pot <= 0) break; if (live.bal > 0){ const p = Math.min(pot, live.bal); live.bal -= p; pot -= p; } }
    debts.forEach(d => { if (d.bal <= 0.005 && d.paidOff == null){ d.bal = 0; d.paidOff = month; } });
    timeline.push(totalLeft());
  }
  return { months: month, stuck: month >= 600, totalInterest, budget, timeline, order: order.map(o => debts.find(d => d.id === o.id)) };
}
function monthLabel(n){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + n); return d.toLocaleDateString(undefined, { month: "long", year: "numeric" }); }
function monthShort(n, withYear){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + n); return d.toLocaleDateString(undefined, withYear ? { month: "short", year: "2-digit" } : { month: "short" }); }

function niceStep(max, count){
  const raw = max / count, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p;
  return 10 * p;
}

function buildTable(s){

function drawChart(el, s){
  el.textContent = "";
  const pts = s.data, n = pts.length; if (!n) return;
  const W = Math.max(240, el.clientWidth), H = s.height || 170;
  const max = Math.max(s.ref ? s.ref.value : 0, ...pts.map(p => p.value), 1);
  const step = niceStep(max, 3), top = Math.ceil(max / step - 1e-9) * step;
  const L = 46, R = 10, T = s.vmark ? 18 : 14, B = 22, pw = W - L - R, ph = H - T - B;
  const y = v => T + ph - v / top * ph;
  const band = pw / n;
  const pos = s.type === "col" ? i => L + band * (i + 0.5) : i => n === 1 ? L + pw / 2 : L + pw * i / (n - 1);
  const svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": s.summary, tabindex: 0, class: "viz" }, el);
  for (let v = 0; v <= top + 1e-9; v += step){
    svgEl("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: v === 0 ? "base" : "grid" }, svg);
    svgText(svg, L - 6, y(v) + 4, moneyShort(v), "tick", "end");
  }
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / (s.type === "line" ? 52 : 34)))));
  pts.forEach((p, i) => {
    if (p.xlabel == null || (n - 1 - i) % every) return;
    const anchor = s.type === "line" && i === 0 ? "start" : s.type === "line" && i === n - 1 ? "end" : "middle";
    svgText(svg, pos(i), H - 6, p.xlabel, "tick", anchor);
  });
  const marks = [];
  if (s.type === "col"){
    const bw = Math.min(24, Math.max(2, band * 0.72), band - 2);
    pts.forEach((p, i) => {
      if (!(p.value > 0)){ marks.push(null); return; }
      const x0 = pos(i) - bw / 2, x1 = x0 + bw, yt = y(p.value), yb = y(0), r = Math.min(4, bw / 2, yb - yt);
      marks.push(svgEl("path", { d: "M" + x0 + "," + yb + "V" + (yt + r) + "Q" + x0 + "," + yt + " " + (x0 + r) + "," + yt + "H" + (x1 - r) + "Q" + x1 + "," + yt + " " + x1 + "," + (yt + r) + "V" + yb + "Z", fill: p.color || "var(--viz-1)", class: "mark" }, svg));
    });
  } else {
    const d = pts.map((p, i) => (i ? "L" : "M") + pos(i).toFixed(1) + "," + y(p.value).toFixed(1)).join("");
    svgEl("path", { d: d + "L" + pos(n - 1) + "," + y(0) + "L" + pos(0) + "," + y(0) + "Z", class: "area" }, svg);
    svgEl("path", { d, class: "line" }, svg);
    pts.forEach((p, i) => { if (p.marker) svgEl("circle", { cx: pos(i), cy: y(p.value), r: 4.5, class: "pt" }, svg); });
  }
  if (s.ref && s.ref.value > 0){ const ry = y(s.ref.value); svgEl("line", { x1: L, x2: W - R, y1: ry, y2: ry, class: "ref" }, svg); }
  if (s.vmark){
    const vx = pos(s.vmark.i);
    svgEl("line", { x1: vx, x2: vx, y1: T, y2: T + ph, class: "ref" }, svg);
    svgText(svg, Math.min(Math.max(vx, L + 18), W - R - 18), T - 5, s.vmark.label, "lbl");
  }
  pts.forEach((p, i) => {
    if (!p.label) return;
    const anchor = s.type === "line" && i === 0 ? "start" : s.type === "line" && i === n - 1 ? "end" : "middle";
    svgText(svg, pos(i) + (anchor === "start" ? 2 : anchor === "end" ? -2 : 0), y(p.value) - 8, p.label, "lbl", anchor);
  });
  // hover / tap / keyboard: one tooltip, nearest point
  const cross = s.type === "line" ? svgEl("line", { y1: T, y2: T + ph, class: "cross", visibility: "hidden" }, svg) : null;
  const hot = s.type === "line" ? svgEl("circle", { r: 5, class: "pt", visibility: "hidden" }, svg) : null;
  let cur = -1;
  const hide = () => { cur = -1; marks.forEach(m => m && m.classList.remove("dim")); if (cross){ cross.setAttribute("visibility", "hidden"); hot.setAttribute("visibility", "hidden"); } tipHide(); };
  const show = (i, cx, cy) => {
    if (hideActive && hideActive !== hide) hideActive();
    cur = i; hideActive = hide;
    if (s.type === "col") marks.forEach((m, j) => m && m.classList.toggle("dim", j !== i));
    else { cross.setAttribute("x1", pos(i)); cross.setAttribute("x2", pos(i)); cross.setAttribute("visibility", "visible"); hot.setAttribute("cx", pos(i)); hot.setAttribute("cy", y(pts[i].value)); hot.setAttribute("visibility", "visible"); }

  };

  svg.addEventListener("pointerdown", e => show(idxAt(e.clientX), e.clientX, e.clientY));
  svg.addEventListener("pointerleave", e => { if (e.pointerType !== "touch") hide(); });

  svg.addEventListener("blur", hide);

    if (e.key === "ArrowLeft" || e.key === "ArrowRight"){ e.preventDefault(); show(Math.max(0, Math.min(n - 1, (cur < 0 ? n - 1 : cur) + (e.key === "ArrowRight" ? 1 : -1)))); }
    if (e.key === "Escape") hide();

}

function chartBillDays(){
  const t = today(), td = pd(t), y0 = td.getFullYear(), m0 = td.getMonth(), nDays = dim(y0, m0);

  const byDay = []; for (let i = 0; i < nDays; i++) byDay.push([]);
  occ.forEach(o => byDay[pd(o.date).getDate() - 1].push(o));

function chartDebt(plan){

function ask(title, fields, okText){
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = '<div class="card"><h3>' + esc(title) + '</h3>' + fields.map((f, i) =>
      '<label for="mf' + i + '">' + esc(f.label) + '</label><input id="mf' + i + '" type="' + (f.type || "text") + '" inputmode="' + (f.type === "number" ? "decimal" : "text") + '" value="' + esc(f.value == null ? "" : f.value) + '"' + (f.type === "number" ? ' step="0.01"' : "") + '>').join("") +
      '<div class="grid2" style="margin-top:16px"><button class="ghost" data-c>Cancel</button><button data-o>' + esc(okText || "Save") + '</button></div></div>';
    document.body.appendChild(m);
    const first = m.querySelector("input"); if (first) setTimeout(() => first.focus(), 30);
    const close = v => { m.remove(); res(v); };
    m.querySelector("[data-c]").onclick = () => close(null);
    m.onclick = e => { if (e.target === m) close(null); };
    m.querySelector("[data-o]").onclick = () => close(fields.map((f, i) => m.querySelector("#mf" + i).value));
    m.addEventListener("keydown", e => { if (e.key === "Enter") m.querySelector("[data-o]").click(); if (e.key === "Escape") close(null); });
  });
}
function confirmBox(text, okText){
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = '<div class="card"><p style="margin-top:0">' + esc(text) + '</p><div class="grid2"><button class="ghost" data-c>Cancel</button><button data-o>' + esc(okText || "OK") + '</button></div></div>';

  });
}

  let h = '<h2>Savings goals</h2><div class="cols"><div class="col">';
  h += S.goals.length ? S.goals.map(g => { const p = g.target ? Math.min(100, Math.round(g.saved / g.target * 100)) : 0;
    return '<div class="card"><div class="row" style="padding:0;border:0"><div class="grow"><div class="t">' + esc(g.name) + '</div><div class="s">' + money(g.saved) + " of " + money(g.target) + " · " + p + '%</div></div><button class="x" data-act="delGoal" data-id="' + g.id + '" aria-label="Delete">×</button></div><div class="bar"><i style="width:' + p + '%"></i></div>' +
      (p >= 100 ? '<div class="note good">Goal reached. Well done. 🎉</div>' : '<div class="grid2" style="margin-top:12px"><button class="soft" data-act="addGoalMoney" data-id="' + g.id + '">Add money</button><button class="ghost" data-act="takeGoalMoney" data-id="' + g.id + '">Take out</button></div>') + "</div>"; }).join("")
    : '<div class="card"><p class="muted" style="margin:0">No goals yet. Even a small one counts.</p></div>';
  h += '</div><div class="col">';
  h += '<div class="card"><h3>New goal</h3><div class="grid2"><input id="g_name" placeholder="e.g. Emergency fund"><input id="g_target" type="number" inputmode="decimal" step="0.01" placeholder="Target"></div><button class="wide" data-act="addGoal">Add goal</button>' +
    '<p class="small muted" style="margin-bottom:0">Adding money to a goal moves it out of your spending balance.</p></div>';
  return h + "</div></div>";
}
function viewDebt(){
  const total = S.debts.reduce((a, d) => a + d.balance, 0);
  const plan = debtPlan();
  let h = '<h2>Debt payoff</h2><div class="cols"><div class="col">';
  if (plan){
    h += '<div class="card hero"><div class="label">Debt-free in</div><div class="big">' + (plan.stuck ? "—" : plan.months + (plan.months === 1 ? " month" : " months")) + "</div>" +
      '<div class="chips"><span class="chip">' + (plan.stuck ? "Payments don't cover interest yet" : "<b>" + monthLabel(plan.months) + "</b>") + '</span><span class="chip">Total owed <b>' + money(total) + '</b></span><span class="chip">Interest <b>' + money(plan.totalInterest) + "</b></span></div></div>";
    if (!plan.stuck) h += chartDebt(plan);
    h += '<div class="card"><h3>Your payoff order</h3><div class="grid2" style="margin-bottom:8px"><button class="' + (S.method === "snowball" ? "" : "ghost") + '" data-act="method" data-v="snowball">Smallest first</button><button class="' + (S.method === "avalanche" ? "" : "ghost") + '" data-act="method" data-v="avalanche">Highest rate first</button></div>' +
      '<p class="small muted">' + (S.method === "snowball" ? "Snowball: quick wins keep you going." : "Avalanche: pays the least interest overall.") + "</p>" +
      plan.order.map((d, i) => '<div class="row"><div class="grow"><div class="t">' + (i + 1) + ". " + esc(d.name) + '</div><div class="s">' + d.rate + "% · min " + money(d.min) + (d.paidOff ? " · paid off " + monthLabel(d.paidOff) : "") + '</div></div><div class="amt">' + money(S.debts.find(x => x.id === d.id).balance) + '</div><button class="x" data-act="payDebt" data-id="' + d.id + '" aria-label="Record payment">＋</button><button class="x" data-act="delDebt" data-id="' + d.id + '" aria-label="Delete">×</button></div>').join("") +
      '<label for="d_extra">Extra each month on top of minimums</label><input id="d_extra" type="number" inputmode="decimal" step="0.01" value="' + (S.extra || 0) + '" data-change="extra"></div>';
  } else h += '<div class="card"><p class="muted" style="margin:0">No debts added. If you have none, that\'s great news.</p></div>';
  h += '</div><div class="col">';
  h += '<div class="card"><h3>Add a debt</h3><input id="d_name" placeholder="Name, e.g. Credit card"><div class="grid3" style="margin-top:10px"><input id="d_bal" type="number" inputmode="decimal" step="0.01" placeholder="Balance"><input id="d_rate" type="number" inputmode="decimal" step="0.01" placeholder="Rate %"><input id="d_min" type="number" inputmode="decimal" step="0.01" placeholder="Min"></div><button class="wide" data-act="addDebt">Add debt</button></div>';
  return h + "</div></div>";
}
function viewSettings(){
  let h = '<h2>Settings</h2><div class="cols"><div class="col">';
  h += '<div class="card"><h3>Make it yours</h3><label>Planner title</label><input data-change="title" value="' + esc(S.title) + '">' +
    '<label>Currency</label><select data-change="currency">' + CURRENCIES.map(c => "<option" + (c === S.currency ? " selected" : "") + ">" + c + "</option>").join("") + "</select>" +
    '<label>Light or dark</label><div class="seg" role="group" aria-label="Light or dark">' + [["light","Light"],["dark","Dark"],["auto","Match device"]].map(([v, l]) =>
      '<button class="' + (S.theme === v ? "on" : "") + '" data-act="setMode" data-v="' + v + '" aria-pressed="' + (S.theme === v) + '">' + l + "</button>").join("") + "</div>" +
    '<label>Colour theme</label><div class="swatches" role="group" aria-label="Colour theme">' + Object.entries(PALETTES).map(([k, p]) => {
      const c = p[currentMode()];
      return '<button class="' + (S.palette === k ? "on" : "") + '" data-act="setPalette" data-v="' + k + '" aria-pressed="' + (S.palette === k) + '"><span class="dots"><i style="background:' + c[7] + '"></i><i style="background:' + c[5] + '"></i><i style="background:' + c[6] + '"></i></span>' + p.name + "</button>"; }).join("") + "</div></div>";
  h += '<div class="card"><h3>Money</h3><div class="grid2"><div><label>Balance right now</label><input type="number" inputmode="decimal" step="0.01" data-change="balance" value="' + S.balance + '"></div><div><label>Safety cushion</label><input type="number" inputmode="decimal" step="0.01" data-change="buffer" value="' + S.buffer + '"></div></div>' +
    '<p class="small muted">The cushion is kept aside and never counted as safe to spend.</p>' +
    '<div class="grid2"><div><label>Pay amount</label><input type="number" inputmode="decimal" step="0.01" data-change="payAmount" value="' + S.pay.amount + '"></div><div><label>Next payday</label><input type="date" data-change="payNext" value="' + S.pay.next + '"></div></div>' +
    '<label>Paid</label><select data-change="payFreq">' + [["weekly","Every week"],["biweekly","Every 2 weeks"],["semimonthly","Twice a month (1st and 15th)"],["monthly","Once a month"]].map(([v, l]) => '<option value="' + v + '"' + (S.pay.freq === v ? " selected" : "") + ">" + l + "</option>").join("") + "</select></div>";
  h += '</div><div class="col">';
  h += '<div class="card"><h3>Keep your numbers safe</h3><p class="small muted" style="margin-top:0">Everything is saved on this device only. Download a backup now and then.</p>' +
    '<div class="grid2"><button class="soft" data-act="backup">Download backup</button><button class="ghost" data-act="restore">Restore backup</button></div><button class="ghost wide" data-act="csv">Export spending (CSV)</button></div>';
  if (!DEMO) h += '<div class="card"><h3>Use it like an app</h3><p class="small" style="margin:0"><b>iPhone / iPad:</b> open in Safari → Share → Add to Home Screen.<br><b>Android:</b> Chrome → ⋮ menu → Add to Home screen.<br><b>Computer:</b> Chrome or Edge → install icon in the address bar.<br>Once added, it works offline.</p></div>';
  else h += '<div class="card"><h3>Enjoying the demo?</h3><p class="small muted" style="margin-top:0">The full app has no spend limit, can be added to your Home Screen and works offline. Download a backup first and the full app will open it.</p><a href="' + esc(SHOP_URL) + '" target="_blank" rel="noopener"><button class="wide">Get the full app</button></a></div>';
  h += '<div class="card"><h3>Start over</h3>' + (S.example ? '<button class="wide" data-act="fresh">Start fresh with my numbers</button>' : '<button class="ghost wide" data-act="reset">Erase everything</button>') + "</div>";
  h += '<p class="small muted" style="text-align:center">Lantern Budget by Gridora Studio · Not financial advice.</p>';
  return h + "</div></div>";
}

/* ---------- actions ---------- */
function addSpend(amount, cat, note, date){
  amount = num(amount);
  if (!(amount > 0)){ toast("Type an amount first."); return false; }
  if (DEMO && getCount() >= DEMO_LIMIT){ toast("The demo's " + DEMO_LIMIT + " spends are used. Everything you typed stays readable."); return false; }
  S.spends.push({ id: uid(), amount, cat: cat || "Other", note: (note || "").trim().slice(0, 80), date: date || today() });
  if (!date || date <= today()) S.balance = num(S.balance - amount);
  if (DEMO) bumpCount();
  save(); toast("Logged " + money(amount)); return true;
}
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function restore(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!o || !o.pay) throw 0; S = normalize(o); save(); tab = "today"; render(); toast("Backup restored."); } catch(e){ toast("That file isn't a Lantern Budget backup."); } };
    r.readAsText(f); };
  inp.click();
}
const actions = {
  startExample(){ S = example(); save(); tab = "today"; render(); },
  startFresh(){ $("#app").innerHTML = viewSetup(); renderChrome(); window.scrollTo(0, 0); },
  finishSetup(){
    const s = blank(); s.balance = num($("#su_bal").value); s.pay.amount = num($("#su_amt").value);
    s.pay.next = $("#su_date").value || addDays(today(), 14); s.pay.freq = $("#su_freq").value; s.currency = $("#su_cur").value;
    S = s; save(); tab = "bills"; render(); toast("Saved. Now add your bills.");
  },
  restore,
  math(){ showMath = !showMath; render(); },
  goBills(){ tab = "bills"; render(); },
  payYes(){ S.balance = num(S.balance + S.pay.amount); let n = S.pay.next; const t = today(); while (n <= t) n = nextPayDate(n); S.pay.next = n; save(); render(); toast("Pay added. Next payday " + nice(n) + "."); },
  payNo(){ S.hideCheck = today(); save(); render(); },
  quickAmt(el){ $("#q_amt").value = el.dataset.v; },
  addSpendQuick(){ if (addSpend($("#q_amt").value, $("#q_cat").value, "", today())) render(); },
  addSpend(){ if (addSpend($("#s_amt").value, $("#s_cat").value, $("#s_note").value, $("#s_date").value)) render(); },
  delSpend(el){ const i = S.spends.findIndex(s => s.id === el.dataset.id); if (i < 0) return; const s = S.spends[i]; if (s.date <= today()) S.balance = num(S.balance + s.amount); S.spends.splice(i, 1); save(); render(); toast("Deleted. Amount added back."); },
  payBill(el){ const b = S.bills.find(x => x.id === el.dataset.id); if (!b) return; const d = el.dataset.date;
    if (b.paid[d]){ delete b.paid[d]; S.balance = num(S.balance + b.amount); } else { b.paid[d] = true; S.balance = num(S.balance - b.amount); }
    save(); render(); },
  addBill(){ const name = $("#b_name").value.trim(), amount = num($("#b_amt").value), day = Math.min(31, Math.max(1, parseInt($("#b_day").value, 10) || 0));
    if (!name || !(amount > 0) || !$("#b_day").value){ toast("Add a name, amount and day."); return; }
    S.bills.push({ id: uid(), name: name.slice(0, 40), amount, day, paid: {}, from: today() }); save(); render(); toast("Bill added."); },
  async editBill(el){ const b = S.bills.find(x => x.id === el.dataset.id); if (!b) return;
    const v = await ask("Edit bill", [{ label: "Name", value: b.name }, { label: "Amount", type: "number", value: b.amount }, { label: "Day of month", type: "number", value: b.day }]);
    if (!v) return; b.name = v[0].trim().slice(0, 40) || b.name; b.amount = num(v[1]) || b.amount; b.day = Math.min(31, Math.max(1, parseInt(v[2], 10) || b.day)); save(); render(); },
  async delBill(el){ if (await confirmBox("Delete this bill?", "Delete")){ S.bills = S.bills.filter(b => b.id !== el.dataset.id); save(); render(); } },
  addGoal(){ const name = $("#g_name").value.trim(), target = num($("#g_target").value); if (!name || !(target > 0)){ toast("Add a name and target."); return; }
    S.goals.push({ id: uid(), name: name.slice(0, 40), target, saved: 0 }); save(); render(); },
  async addGoalMoney(el){ const g = S.goals.find(x => x.id === el.dataset.id); const v = await ask("Add to " + g.name, [{ label: "Amount", type: "number" }], "Add"); if (!v) return; const a = num(v[0]); if (a > 0){ g.saved = num(g.saved + a); S.balance = num(S.balance - a); save(); render(); } },
  async takeGoalMoney(el){ const g = S.goals.find(x => x.id === el.dataset.id); const v = await ask("Take out of " + g.name, [{ label: "Amount", type: "number" }], "Take out"); if (!v) return; const a = Math.min(num(v[0]), g.saved); if (a > 0){ g.saved = num(g.saved - a); S.balance = num(S.balance + a); save(); render(); } },
  async delGoal(el){ if (await confirmBox("Delete this goal? Money saved in it is not moved back.", "Delete")){ S.goals = S.goals.filter(g => g.id !== el.dataset.id); save(); render(); } },
  addDebt(){ const name = $("#d_name").value.trim(), bal = num($("#d_bal").value), rate = num($("#d_rate").value), min = num($("#d_min").value);
    if (!name || !(bal > 0) || !(min > 0)){ toast("Add a name, balance and minimum payment."); return; }
    S.debts.push({ id: uid(), name: name.slice(0, 40), balance: bal, rate, min }); save(); render(); },
  async payDebt(el){ const d = S.debts.find(x => x.id === el.dataset.id); const v = await ask("Payment to " + d.name, [{ label: "Amount paid", type: "number" }], "Record"); if (!v) return; const a = Math.min(num(v[0]), d.balance); if (a > 0){ d.balance = num(d.balance - a); S.balance = num(S.balance - a); save(); render(); toast(d.balance === 0 ? d.name + " is paid off! 🎉" : "Payment recorded."); } },
  async delDebt(el){ if (await confirmBox("Delete this debt?", "Delete")){ S.debts = S.debts.filter(d => d.id !== el.dataset.id); save(); render(); } },
  method(el){ S.method = el.dataset.v; save(); render(); },
  toggleTable(el){
    const s = CHARTS[+el.dataset.id]; if (!s) return;
    const open = openTables[s.key] = !openTables[s.key], card = el.closest(".card");
    card.querySelector("[data-chart]").classList.toggle("hidden", open);
    card.querySelector("[data-table]").classList.toggle("hidden", !open);
    el.textContent = open ? "Chart" : "Table"; el.setAttribute("aria-pressed", open);
    drawCharts();
  },
  toggleMode(){ S.theme = currentMode() === "dark" ? "light" : "dark"; save(); render(); },
  setMode(el){ S.theme = el.dataset.v; save(); render(); },
  setPalette(el){ if (PALETTES[el.dataset.v]){ S.palette = el.dataset.v; save(); render(); } },
  backup(){ download("lantern-budget-backup-" + today() + ".json", JSON.stringify(S, null, 1), "application/json"); },
  csv(){ const rows = [["Date","Amount","Category","Note"]].concat(S.spends.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(s => [s.date, s.amount, s.cat, s.note]));
    download("lantern-spending-" + today() + ".csv", rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n"), "text/csv"); },
  async fresh(){ if (await confirmBox("Clear the example numbers and start with yours?", "Start fresh")) actions.startFresh(); },
  async reset(){ if (await confirmBox("Erase everything on this device? Download a backup first if you might need it.", "Erase")){ S = null; try { localStorage.removeItem(KEY); } catch(e){} render(); } }
};
const changes = {
  title: v => S.title = v.slice(0, 40) || "My calm money plan",
  currency: v => S.currency = v,
  theme: v => S.theme = v,
  balance: v => S.balance = num(v),
  buffer: v => S.buffer = Math.max(0, num(v)),
  payAmount: v => S.pay.amount = num(v),
  payNext: v => { if (v) { S.pay.next = v; S.hideCheck = ""; } },
  payFreq: v => S.pay.freq = v,
  extra: v => S.extra = Math.max(0, num(v))
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t){ tab = t.dataset.tab; showMath = false; render(); return; }
  const a = e.target.closest("[data-act]"); if (a && actions[a.dataset.act]){ e.preventDefault(); actions[a.dataset.act](a); }
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.change; if (!k || !changes[k]) return;
  changes[k](e.target.value); if (S.example && ["balance","payAmount","payNext"].includes(k)) S.example = false; save();
  if (k === "title") renderChrome(); else render();
});

/* ---------- start ---------- */
S = load();
render();
if (!DEMO && "serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
